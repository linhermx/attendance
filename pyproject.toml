[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance"
version = "2.3.1"
description = "Herramienta interna para analizar asistencias diarias a partir de archivos del checador."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "pandas",
  "openpyxl",
  "xlsxwriter",
  "requests",
  "xlrd"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
